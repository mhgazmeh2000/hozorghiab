[project]
name = "freebuff-attendance-backend"
version = "0.1.0"
description = "Backend for attendance device management & monitoring"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
